name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The unit suite must not need a database or the network.
      - run: pytest -m "not integration"

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: netsentinel_test
          POSTGRES_USER: netsentinel
          # Throwaway credential for the ephemeral CI container only.
          POSTGRES_PASSWORD: netsentinel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsentinel -d netsentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: netsentinel
      PGPASSWORD: netsentinel_ci
      TEST_DATABASE_URL: postgresql+asyncpg://netsentinel:netsentinel_ci@localhost:5432/netsentinel_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://netsentinel:netsentinel_ci@localhost:5432/netsentinel_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Migrations run on their own database: the test suite builds its schema
      # with create_all, so it cannot catch a broken or drifting migration.
      - name: Create migrations database
        run: psql -d netsentinel_test -c "CREATE DATABASE netsentinel_migrations"
      - name: Apply Alembic migrations
        run: alembic upgrade head
      - name: Check models match migrations
        run: alembic check
      - run: pytest -m integration

  frontend:
    name: Frontend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
