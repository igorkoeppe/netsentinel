# Alembic configuration for NetSentinel.
#
# ``sqlalchemy.url`` is intentionally left empty here — it is set
# programmatically from ``settings.DATABASE_URL`` inside ``migrations/env.py``
# to avoid storing credentials in version-controlled files.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# File name template for new migration scripts.
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration file names.
timezone = UTC

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# Set to INFO to log SQL — useful for debugging, but avoid in production
# as it can expose connection strings.

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
